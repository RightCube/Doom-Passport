<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Doom Passport | KUBAS PROJECTS</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/passport.css">
</head>
<script src="app.js"></script>
<body>

<header class="site-header">

    <div class="container">

        <a href="../" class="logo">
            <span class="logo-symbol">&gt;_</span>
            <span class="logo-text">
                KUBAS PROJECTS
            </span>
        </a>

        <nav class="main-nav">
            <a href="../">Domů</a>
            <a href="../#projects">Projekty</a>
        </nav>

    </div>

</header>

<main>

    <section class="passport-hero">

        <div class="container">

            <h1>DOOM PASSPORT</h1>

            <p>
                Evidence megawadů, statistik
                a herního postupu.
            </p>

        </div>

    </section>

    <section class="section">

        <div class="container">

            <div class="passport-stats">

                <div class="stat-card">

                    <span class="stat-label">
                        Dokončeno
                    </span>

                    <div class="stat-value">
                        0
                    </div>

                </div>

                <div class="stat-card">

                    <span class="stat-label">
                        Aktivní seznam
                    </span>

                    <div class="stat-value">
                        0
                    </div>

                </div>

                <div class="stat-card">

                    <span class="stat-label">
                        Splnění
                    </span>

                    <div class="stat-value">
                        0%
                    </div>

                </div>

            </div>

            <div class="progress-bar">
                <div class="progress-fill"></div>
            </div>

        </div>

    </section>

    <section class="section">

        <div class="container">

            <h2>Přidat nový WAD</h2>

            <div class="add-form">

                <input placeholder="Název WADu">

                <input placeholder="Styl">

                <input placeholder="Poznámka">

                <button class="button">
                    Přidat WAD
                </button>

            </div>

        </div>

    </section>

    <section class="section">

        <div class="container">

            <h2>Razítka získaná</h2>

            <div class="wad-list">

                <div class="wad-card completed">

                    <div class="wad-title">
                        😈 Ancient Aliens
                    </div>

                    <div class="wad-meta">
                        Stylová moderní klasika
                    </div>

                    <span class="badge badge-completed">
                        Dohráno
                    </span>

                </div>

                <div class="wad-card">

                    <div class="wad-title">
                        🔥 Valiant
                    </div>

                    <div class="wad-meta">
                        Moderní megawad
                    </div>

                    <span class="badge badge-completed">
                        Dohráno
                    </span>

                </div>

            </div>

        </div>

    </section>

</main>

<footer class="site-footer">

    <div class="container">

        <p>
            Doom Passport • KUBAS PROJECTS
        </p>

    </div>

</footer>

</body>
</html>
